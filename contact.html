  <div class="container">
    <a href="index.html" class="brand">Web Creation Portfolio</a>
    <ul class="nav-list">
      <li><a href="index.html" data-nav-link="top">TOP</a></li>
      <li><a href="works.html" data-nav-link="works">WORKS</a></li>

<main>
  <section style="padding-bottom:0;">
    <div class="container section-head reveal">
      <div class="eyebrow">CONTACT</div>
      <h2>お問い合わせ</h2>
      <p>現在は各プラットフォーム経由でのご依頼受付を準備しています。料金・納期のご相談だけでも構いませんので、お気軽にご連絡ください。</p>
    </div>

<script src="js/site-config.js"></script>
<script src="js/works-data.js"></script>
<script src="js/main.js"></script>
<script>
  (function () {
    var platforms = [
      { key: "crowdworks", label: "クラウドワークス" },
      { key: "lancers", label: "ランサーズ" },
      { key: "coconala", label: "ココナラ" },
    ];
    var grid = document.getElementById("contact-grid");
    grid.innerHTML = platforms
      .map(function (p) {
        var url = SITE_CONFIG.contact[p.key];
        var isActive = !!url;
        var inner =
          '<h3>' + p.label + '</h3>' +
          '<span class="contact-status' + (isActive ? " is-live" : "") + '">' +
          (isActive ? "対応中" : "準備中") +
          "</span>";
        var cls = "contact-card reveal" + (isActive ? " is-active" : "");
        return isActive
          ? '<a class="' + cls + '" href="' + url + '" target="_blank" rel="noopener">' + inner + "</a>"
          : '<div class="' + cls + '">' + inner + "</div>";
      })
      .join("");

    var email = SITE_CONFIG.contact.email;
    if (email) {
      grid.insertAdjacentHTML(
        "beforeend",
        '<a class="contact-card reveal is-active" href="mailto:' + email + '"><h3>メール</h3><span class="contact-status is-live">対応中</span></a>'
      );
    }

    if (window.__initReveal) window.__initReveal();
  })();
</script>
</body>
</html>
