# コラムの予約公開
#   column/_src/YYYY-MM-DD-slug.md のうち、当日（JST）以前の記事だけを scripts/build-column.mjs が
#   HTML に変換して main へ commit する。未来日の記事は HTML・一覧・サイトマップのどこにも出ない。
#   毎朝 07:00 JST（22:00 UTC）。手動実行は Actions タブの Run workflow。
name: publish-column
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-column
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build column (today JST)
        id: build
        run: |
          set -e
          node scripts/build-column.mjs
          git add -A column sitemap.xml
          if git diff --cached --quiet; then
            echo "no changes"; echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            TODAY="$(TZ=Asia/Tokyo date +%F)"
            git -c user.name=publish-column -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "コラム予約公開 $TODAY（publish-column）"
            git push origin HEAD:main
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages build
        if: steps.build.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "pages build request skipped"
